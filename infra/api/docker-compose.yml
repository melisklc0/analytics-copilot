services:
  analytics-copilot-api:
    build:
      context: ../..
      dockerfile: infra/api/Dockerfile
    container_name: analytics_copilot_api
    # Read environment variables from the root .env file
    env_file:
      - path: ../../.env
        required: false
    # Tiny init process improves signal handling and zombie process cleanup.
    init: true
    ports:
      - "${CORE_API_PORT:-8090}:8090"
    # Read-only bind mount is convenient for local development without letting the container mutate source.
    volumes:
      - ../../src:/app/src:ro
      # TODO: dbt pipeline — dbt docs generate çıktısını image build adımında üret
      - ../../dbt/target:/app/dbt/target:ro
      - ../../logs:/app/logs:rw
    environment:
      UV_COMPILE_BYTECODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Inside the Docker network the DB always listens on 5432; POSTGRES_PORT in .env is the host-side mapping only.
      POSTGRES_PORT: "5432"
    # Minimal hardening that stays low-friction for development.
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    # Wait for the seed -> dbt pipeline so the API starts against a populated
    # warehouse with a fresh manifest.json, never an empty one.
    depends_on:
      analytics-copilot-db:
        condition: service_healthy
      analytics-copilot-dbt:
        condition: service_completed_successfully
    # Healthcheck ensures container is responsive before marking healthy, with retries and timeouts for robustness.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - analytics-copilot-network

networks:
  analytics-copilot-network:
    name: analytics-copilot-network
