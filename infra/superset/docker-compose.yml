# BI dashboard stack (Apache Superset). Opt-in via the `dashboard` profile:
#   docker compose --profile dashboard up
# Left out of the default `docker compose up` to keep the local footprint small
# (web + worker + beat + metadata Postgres + Redis).
services:
  superset-init:
    build:
      context: ../..
      dockerfile: infra/superset/Dockerfile
    container_name: analytics_copilot_superset_init
    profiles: ["dashboard"]
    depends_on:
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SQLALCHEMY_DATABASE_URI: "postgresql://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}"
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-local-dev-secret-key-change-in-prod}"
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset init &&
      (superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Analytics --lastname Copilot --email ${SUPERSET_ADMIN_EMAIL:-admin@analytics-copilot.local} --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true)
      "
    networks:
      - analytics-copilot-network
    restart: "no"

  superset:
    build:
      context: ../..
      dockerfile: infra/superset/Dockerfile
    container_name: analytics_copilot_superset
    profiles: ["dashboard"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-db:
        condition: service_healthy
      superset-redis:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SQLALCHEMY_DATABASE_URI: "postgresql://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}"
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-local-dev-secret-key-change-in-prod}"
    command: ["/usr/bin/run-server.sh"]
    networks:
      - analytics-copilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  superset-worker:
    build:
      context: ../..
      dockerfile: infra/superset/Dockerfile
    container_name: analytics_copilot_superset_worker
    profiles: ["dashboard"]
    depends_on:
      superset:
        condition: service_started
    env_file:
      - path: ../../.env
        required: false
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SQLALCHEMY_DATABASE_URI: "postgresql://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}"
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-local-dev-secret-key-change-in-prod}"
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--loglevel=info"]
    networks:
      - analytics-copilot-network
    restart: unless-stopped

  superset-beat:
    build:
      context: ../..
      dockerfile: infra/superset/Dockerfile
    container_name: analytics_copilot_superset_beat
    profiles: ["dashboard"]
    depends_on:
      superset:
        condition: service_started
    env_file:
      - path: ../../.env
        required: false
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SQLALCHEMY_DATABASE_URI: "postgresql://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}"
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-local-dev-secret-key-change-in-prod}"
    command:
      - "celery"
      - "--app=superset.tasks.celery_app:app"
      - "beat"
      - "--pidfile"
      - "/tmp/celerybeat.pid"
      - "--schedule"
      - "/tmp/celerybeat-schedule"
    networks:
      - analytics-copilot-network
    restart: unless-stopped

  superset-db:
    image: postgres:17-alpine
    container_name: analytics_copilot_superset_db
    profiles: ["dashboard"]
    environment:
      POSTGRES_DB: "${SUPERSET_DB_NAME:-superset}"
      POSTGRES_USER: "${SUPERSET_DB_USER:-superset}"
      POSTGRES_PASSWORD: "${SUPERSET_DB_PASSWORD:-superset}"
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER:-superset}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  superset-redis:
    image: redis:7-alpine
    container_name: analytics_copilot_superset_redis
    profiles: ["dashboard"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  superset_db_data:
    name: analytics_copilot_superset_db_data

networks:
  analytics-copilot-network:
    name: analytics-copilot-network
