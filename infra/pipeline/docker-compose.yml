# Data-bootstrap pipeline: seed the sample, then build the dbt warehouse.
# Both are one-shot jobs that run in order on `docker compose up` and exit:
#   postgres(healthy) -> seeder(completed) -> dbt(completed) -> api / superset
services:
  # Load the committed Olist sample into raw.* once Postgres is healthy, then
  # exit. Reuses the API image (has psycopg + the project deps); scripts/ and
  # data/seed/ are bind-mounted since the image doesn't bake them.
  analytics-copilot-seeder:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      target: api
    container_name: analytics_copilot_seeder
    working_dir: /app
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Inside the Docker network the DB always listens on 5432.
      POSTGRES_HOST: analytics-copilot-db
      POSTGRES_PORT: "5432"
      PYTHONPATH: /app/src
      PYTHONUNBUFFERED: "1"
      OLIST_DATA_DIR: /app/data/seed/olist-sample
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../data/seed:/app/data/seed:ro
    command: ["/app/.venv/bin/python", "scripts/load_olist.py"]
    depends_on:
      analytics-copilot-db:
        condition: service_healthy
    networks:
      - analytics-copilot-network
    restart: "no"

  # Build the dbt warehouse (staging -> intermediate -> marts) once the sample
  # is seeded, then exit. Uses the official dbt-postgres image with the dbt/
  # project bind-mounted; target/ lands on the host so the API can read
  # manifest.json (see the api service's read-only dbt/target mount).
  analytics-copilot-dbt:
    build:
      context: ../..
      dockerfile: infra/pipeline/dbt/Dockerfile
    container_name: analytics_copilot_dbt
    working_dir: /usr/app
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Inside the Docker network the DB always listens on 5432.
      POSTGRES_HOST: analytics-copilot-db
      POSTGRES_PORT: "5432"
      # profiles.yml lives in the project dir, not the default ~/.dbt.
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ../../dbt:/usr/app:rw
    # build = run + test interleaved in DAG order (fail-fast). docs generate is
    # required afterwards: the API reads target/manifest.json (DBT_MANIFEST_PATH).
    entrypoint: ["/bin/sh", "-c"]
    command: ["dbt deps && dbt build && dbt docs generate"]
    depends_on:
      analytics-copilot-seeder:
        condition: service_completed_successfully
    networks:
      - analytics-copilot-network
    restart: "no"

networks:
  analytics-copilot-network:
    name: analytics-copilot-network
