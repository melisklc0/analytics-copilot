services:
  analytics-copilot-db:
    image: postgres:17-alpine
    container_name: analytics_copilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - analytics_copilot_postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytics_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: '256mb'
    restart: unless-stopped

volumes:
  analytics_copilot_postgres_data:
    name: analytics_copilot_postgres_data

networks:
  analytics-copilot-network:
    name: analytics-copilot-network
