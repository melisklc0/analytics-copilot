services:
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: analytics_copilot_langfuse_worker
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-postgres:5432/langfuse"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://${LANGFUSE_CLICKHOUSE_USER:-default}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:9000"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_USER: "${LANGFUSE_CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${LANGFUSE_MINIO_ACCESS_KEY:-minio}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_SECRET_KEY:-miniosecret}"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_AUTH:-langfuse}"

      SALT: "${LANGFUSE_SALT:-langfuse-dev-salt-change-in-prod}"
    networks:
      - analytics-copilot-network
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: analytics_copilot_langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-postgres:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:${LANGFUSE_PORT:-3000}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-langfuse-dev-nextauth-secret-change-in-prod}"
      SALT: "${LANGFUSE_SALT:-langfuse-dev-salt-change-in-prod}"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://${LANGFUSE_CLICKHOUSE_USER:-default}:${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:9000"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_USER: "${LANGFUSE_CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "${LANGFUSE_MINIO_ACCESS_KEY:-minio}"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${LANGFUSE_MINIO_SECRET_KEY:-miniosecret}"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: "analytics-copilot"
      LANGFUSE_INIT_ORG_NAME: "Analytics Copilot"
      LANGFUSE_INIT_PROJECT_ID: "analytics-copilot"
      LANGFUSE_INIT_PROJECT_NAME: "Analytics Copilot"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL:-admin@analytics-copilot.local}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD:-copilotadmin123.}"
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "${LANGFUSE_REDIS_AUTH:-langfuse}"

    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:17-alpine
    container_name: analytics_copilot_langfuse_postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD:-langfuse}"
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio
    container_name: analytics_copilot_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${LANGFUSE_MINIO_ACCESS_KEY:-minio}"
      MINIO_ROOT_PASSWORD: "${LANGFUSE_MINIO_SECRET_KEY:-miniosecret}"
    volumes:
      - langfuse_minio_data:/data
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  langfuse-minio-init:
    image: minio/mc
    container_name: analytics_copilot_minio_init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://langfuse-minio:9000 ${LANGFUSE_MINIO_ACCESS_KEY:-minio} ${LANGFUSE_MINIO_SECRET_KEY:-miniosecret};
        mc mb --ignore-existing local/langfuse;
        exit 0;
      "
    networks:
      - analytics-copilot-network

  langfuse-redis:
    image: redis:7-alpine
    container_name: analytics_copilot_langfuse_redis
    command: redis-server --requirepass "${LANGFUSE_REDIS_AUTH:-langfuse}"
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: analytics_copilot_clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: "${LANGFUSE_CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse}"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    networks:
      - analytics-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password ${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  langfuse_postgres_data:
    name: langfuse_postgres_data
  langfuse_clickhouse_data:
    name: langfuse_clickhouse_data
  langfuse_clickhouse_logs:
    name: langfuse_clickhouse_logs
  langfuse_minio_data:
    name: langfuse_minio_data

networks:
  analytics-copilot-network:
    name: analytics-copilot-network
