[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_copilot"]

[project]
name = "analytics-copilot"
version = "0.1.0"
description = "Natural language analytics interface for dbt-modeled PostgreSQL data warehouses. LangGraph workflow, self-healing SQL validation, read-only query enforcement."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=4.0.0",
    "sqlglot>=30.11.0",
    "langgraph>=1.2.5",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
]

[dependency-groups]
dev = [
    "dbt-core>=1.9.0",
    "dbt-postgres>=1.9.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes (dead code, unused imports).

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
