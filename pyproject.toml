[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_copilot"]

[project]
name = "analytics-copilot"
version = "0.1.0"
description = "Natural language analytics interface for dbt-modeled PostgreSQL data warehouses. LangGraph workflow, self-healing SQL validation, read-only query enforcement."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=4.0.0",
    "sqlglot>=30.11.0",
    "langgraph>=1.2.5",
    "langchain>=1.0.0",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.2",
    "pyyaml>=6.0",
]

[dependency-groups]
# dbt is a build-time tool, not an API runtime dependency. Isolating it lets the
# dbt container install ONLY dbt (uv sync --only-group dbt) at the exact locked
# version used locally, so package-lock.yml never drifts across environments.
dbt = [
    "dbt-core>=1.9.0",
    "dbt-postgres>=1.9.0",
]
dev = [
    { include-group = "dbt" },
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]
# Streamlit console — a standalone HTTP client for the API. Isolated so the API
# runtime image never pulls streamlit/pandas (install via `uv sync --group ui`).
ui = [
    "streamlit>=1.42.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes (dead code, unused imports).

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
