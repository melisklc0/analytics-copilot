[project]
name = "analytics-copilot"
version = "0.1.0"
description = "Natural language analytics interface for dbt-modeled PostgreSQL data warehouses. LangGraph workflow, self-healing SQL validation, read-only query enforcement."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes (dead code, unused imports).

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
