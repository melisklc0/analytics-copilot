[project]
name = "openrag-eval-platform"
version = "0.1.0"
description = "Production-minded RAG evaluation and observability platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
